name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run deterministic core tests
        run: python -m unittest discover -s backend/tests -t backend -v
      - name: Validate JSON fixtures
        run: |
          python -m json.tool data/samples/yamuna-2023-replay.json > /dev/null
          python -m json.tool data/samples/delhi-water-demo-graph.json > /dev/null
          python -m json.tool data/samples/multi-resource-demo-graph.json > /dev/null
          python -m json.tool data/samples/multi-resource-trigger.json > /dev/null
          python -m json.tool data/sources/source-register.json > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
